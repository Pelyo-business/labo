<script>
/* Les adresses « …/commander/<nom-du-restaurant> » n'existent pas comme fichiers : l'hébergement renvoie cette page, qui
   envoie le client vers la page de commande avec le nom du restaurant. Ainsi l'adresse d'un QR code reste la même
   quel que soit l'hébergement. Voir docs/COMMANDE-LIEN-QR.md. */
(function(){
  var m = /^(.*\/)commander\/([a-z0-9-]+)\/?$/.exec(location.pathname);
  if (m) location.replace(m[1] + 'commander.html?r=' + m[2]);
})();
</script>
