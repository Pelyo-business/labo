<!-- Pas de maquette de téléphone : .device remplit l'écran réel (colonne
     centrée sur grand écran). #home est rendu par app.js — écran de
     connexion, puis liste des postes une fois le compte démo choisi. -->
<div class="device" id="device">
  <div class="glass" id="glass">

    <!-- Écran de chargement : visible dès la première image, avant le
         moindre script. app.js le retire une fois l’appli prête derrière. -->
    <div class="splash" id="splash" data-poste="cuisine" role="status" aria-label="Chargement de Pelyo Labo Cuisine">
      <div class="splash-in">
        <span class="splash-halo" aria-hidden="true"></span>
        <img class="splash-logo" src="assets/logo-toque.png" alt="" width="104" height="104">
        <b class="splash-nom">Labo <span>Cuisine</span></b>
        <span class="splash-barre" aria-hidden="true"><i></i></span>
        <small class="splash-etat" id="splash-etat">Préparation de la cuisine de démonstration…</small>
      </div>
    </div>

    <div class="home" id="home"></div>

    <!-- les applications s'insèrent ici -->

    <div class="toast" id="toast" role="status"></div>
    <button class="homebar" id="homebar" aria-label="Fermer l'application"><i></i></button>
  </div>
</div>
