<!-- Pas de maquette de téléphone : .device remplit l'écran réel (colonne
     centrée sur grand écran). #home est rendu par app.js — écran de
     connexion, puis liste des postes une fois le compte démo choisi. -->
<div class="device" id="device">
  <div class="glass" id="glass">

    <div class="home" id="home"></div>

    <!-- les applications s'insèrent ici -->

    <div class="toast" id="toast" role="status"></div>
    <button class="homebar" id="homebar" aria-label="Fermer l'application"><i></i></button>
  </div>
</div>

<script src="src/data.js?v=1.0.0-7e0b4d5"></script>
<!-- Connexion réelle : bibliothèque officielle Supabase, version figée et
     empreinte vérifiée par le navigateur (un fichier modifié est refusé).
     Sans elle (hors ligne), seul le compte démo fonctionne. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>

  if ("serviceWorker" in navigator) {
