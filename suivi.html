<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Suivi de commande</title>
<link rel="icon" href="assets/logo-toque.png">
<style>
/* Page de suivi envoyée au client par SMS. Elle n'affiche que les étapes et
   l'heure prévue : ni nom, ni adresse, ni téléphone. */
:root{--bg:#F6F5F3;--carte:#FFFFFF;--filet:#E4E0DB;--encre:#1C1A18;--gris:#6F6A64;--orange:#D9631E;--vert:#2E9E66;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0B0B0C;--carte:#17171A;--filet:#2A2A2E;--encre:#F2EEE9;--gris:#A19B94;--orange:#F07A2E;--vert:#4CC38A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--encre);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 32px)}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.resto{display:flex;align-items:center;gap:10px;color:var(--gris);font-weight:600;font-size:14px}
.resto img{width:32px;height:32px}
h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.heure{margin:6px 0 0;color:var(--gris);font-size:16px}
.heure b{color:var(--encre)}
.barre{height:6px;border-radius:6px;background:var(--filet);overflow:hidden}
.barre i{display:block;height:100%;background:var(--orange);border-radius:6px;transition:width .6s ease}
.retard{margin:0;padding:12px 14px;border:1px solid var(--orange);border-radius:14px;font-size:15px}
.etapes{list-style:none;margin:0;padding:0;border:1px solid var(--filet);border-radius:16px;background:var(--carte)}
.etapes li{display:flex;align-items:center;gap:12px;padding:14px 16px}
.etapes li+li{border-top:1px solid var(--filet)}
.etapes .rond{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--filet)}
.etapes .fait .rond{border-color:var(--vert);background:var(--vert)}
.etapes .encours .rond{border-color:var(--orange)}
.etapes .t{flex:1}
.etapes .a{color:var(--gris);font-size:14px;font-variant-numeric:tabular-nums}
.etapes .attente{color:var(--gris)}
.note{margin:0;color:var(--gris);font-size:13px;text-align:center}
</style>
<meta name="robots" content="noindex, nofollow"><script>window.PELYO_ENV={nom:"LABO",version:"v1.0.0",detail:"v1.0.0+489fe03"};</script><style>.envb{display:inline-flex;align-items:center;flex:none;margin-left:7px;padding:2px 6px;border-radius:6px;vertical-align:2px;background:#4F8BD4;color:#0B0B0C;font:600 8.5px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;white-space:nowrap}b:has(>.envb-nom){display:flex!important;align-items:center;min-width:0}.envb-nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0} print{.envb{display:none}}</style></head>
<body>
<main id="page">
  <p class="note">Chargement…</p>
</main>
<script>
(function(){
  "use strict";
  var PREFIXE = 'pelyo:cuisine:demo:v2:';
  var id = +((/[?&]c=(\d+)/.exec(location.search) || [])[1] || 0);
  function hhmm(ms){ var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + ' h ' + ('0' + d.getMinutes()).slice(-2); }
  function esc(t){ return String(t).replace(/[&<>"]/g, function(x){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]; }); }
  function lire(){
    try {
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if (k.indexOf(PREFIXE) !== 0) continue;
        var x = JSON.parse(localStorage.getItem(k) || 'null');
        if (!x || !x.cmds) continue;
        for (var j = 0; j < x.cmds.length; j++) if (x.cmds[j].id === id) return {resto:k.slice(PREFIXE.length), c:x.cmds[j], papier:!!(x.suivi && x.suivi.papier)};
      }
    } catch(e){}
    return null;
  }
  function peindre(){
    var d = lire(), page = document.getElementById('page');
    if (!d){ page.innerHTML = '<h1>Commande introuvable</h1><p class="note">Ce lien de suivi n’est plus valable.</p>'; return; }
    var c = d.c, liv = c.mode === 'livraison', fini = c.etat === 'terminee' || !!c.arriveeAt, annule = c.etat === 'annulee';
    var heure = c.promesseAt + (c.retardPrevenu ? c.retardPrevenu.min * 60000 : 0);
    var etapes;
    if (d.papier && !liv) etapes = [['Commande confirmée', c.recueAt]];
    else if (d.papier) etapes = [['Commande confirmée', c.recueAt], ['En route', c.departAt], ['Livrée', c.arriveeAt]];
    else etapes = [['Commande reçue', c.recueAt], ['En préparation', c.commenceAt && c.etat !== 'confirmee' ? c.commenceAt : null], ['Prête', c.preteAt]]
      .concat(liv ? [['En route', c.departAt], ['Livrée', c.arriveeAt || (fini ? Date.now() : null)]] : [['Récupérée', fini ? (c.arriveeAt || Date.now()) : null]]);
    var faites = 0; etapes.forEach(function(e, i){ if (e[1]) faites = i + 1; });  // une étape franchie valide celles d'avant
    var titre = annule ? 'Commande annulée' : fini ? (liv ? 'Livrée, bon appétit !' : 'Récupérée, bon appétit !')
      : c.departAt ? 'En route' : c.preteAt ? (liv ? 'Prête, bientôt en route' : 'Prête, vous pouvez venir')
      : (!d.papier && c.etat === 'preparation') ? 'En préparation' : 'Commande confirmée';
    var sousTitre = annule ? 'Contactez le restaurant si besoin.' : fini || (c.preteAt && !liv) ? '' : (liv ? (c.departAt ? 'Arrivée prévue vers ' : 'Livraison prévue vers ') : 'Prête vers ') + '<b>' + hhmm(c.departAt && liv ? (c.prevuArrivee || heure) : heure) + '</b>';
    page.innerHTML =
      '<div class="resto"><img src="assets/logo-toque.png" alt="">' + esc(d.resto) + ' · commande ' + c.id + '</div>' +
      '<div><h1>' + titre + '</h1>' + (sousTitre ? '<p class="heure">' + sousTitre + '</p>' : '') + '</div>' +
      (etapes.length > 1 ? '<div class="barre"><i style="width:' + Math.round(faites / etapes.length * 100) + '%"></i></div>' : '') +
      (c.retardPrevenu && !fini ? '<p class="retard">Petit retard : nouvelle heure ' + hhmm(heure) + '.' + (c.retardPrevenu.geste === 'boisson' ? ' La boisson est offerte.' : c.retardPrevenu.geste === 'remise' ? ' −10 % sur votre commande.' : '') + '</p>' : '') +
      '<ol class="etapes">' + etapes.map(function(e, i){
        var cls = i < faites ? 'fait' : i === faites ? 'encours' : '';
        return '<li class="' + cls + '"><span class="rond"></span><span class="t' + (i < faites ? '' : ' attente') + '">' + e[0] + '</span><span class="a">' + (e[1] ? hhmm(e[1]) : '') + '</span></li>';
      }).join('') + '</ol>' +
      '<p class="note">Page de démonstration Pelyo. Elle se met à jour toute seule.</p>';
  }
  peindre();
  setInterval(peindre, 2000);
  window.addEventListener('storage', peindre);
})();
</script>
</body>
</html>
